# 介面與物品名稱的語言，物品預設顯示這個語言的原版名稱（zh-TW 或 en-US）
language: zh-TW

# 買賣使用的貨幣代碼（tokaEconomy 的設定）
currency: money

# 消費稅，百分比，向上取整數；0 為不收
tax:
  # 在商店視窗購買
  window: 5
  # 在告示牌購買（告示牌的價格已含稅概念，預設不另收）
  sign: 0
  # 稅金存入的帳戶（UUID）；留空則存入 tokaRegions 的主國庫
  account: ""

# 交易結果一定會寫進聊天室當紀錄；top 為 true 時，同一行也會顯示在頂部（tokaDisplay），false 則只留聊天室
notice:
  top: true

window:
  # 品項清單每頁幾筆
  per-page: 30
  # 單次最多買或賣幾組
  max-packs: 36
  # 按鈕上的圖片（類別與品項）；false 為全部不用圖片
  show-icons: true
  # 主選單各類別的按鈕圖片（材質路徑）；留空則不用圖片，沒寫的類別用內建圖片
  icons: {}

# 個別品項的價格、名稱與停用請寫在 overrides.yml，不要改這個檔案

# 個人商店（攤位）：玩家用背包的東西開店，庫存存在外掛的資料庫（stalls 資料夾），不是實體箱子
stall:
  # 每位玩家最多幾個攤位
  max-per-player: 3
  # 每個攤位最多幾種商品（相同物品、相同附魔與名稱算同一種）
  max-products: 27
  # 每個商品每個的最高價格
  max-price: 1000000
  # 攤位的消費稅，百分比，買家另付；-1 表示跟 tax.window 一樣。稅金和商店一樣存入 tax.account 或主國庫
  tax: -1
  # 告示牌第一行要寫的字，第二行寫攤位名稱
  sign-tag: "[stall]"

# 個人商店資料的存放：stalls 資料夾（SQLITE、JSON 或 YAML），每個攤位一份文件
storage:
  backend: SQLITE
  directory: stalls
